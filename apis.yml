name: SXD
description: 'SXD is a New York-based design-technology company founded in 2022 that uses patented
  artificial intelligence to generate zero-waste apparel patterns for the fashion industry. Its SXD AI
  platform transforms a sketch or design concept into production-ready patterns that eliminate fabric
  waste before the first cut, and the company reports up to 69% material savings across more than 35 brand
  and manufacturing partners. SXD has been recognized with the Global Change Award and a top prize at the
  SXSW Pitch competition, and is backed by Initialized Capital. SXD does not currently publish a public
  developer API, SDK, or documentation surface.'
